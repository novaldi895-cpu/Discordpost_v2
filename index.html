<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Autopost</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background-color: #f3f4f6; }
        .sidebar-active { background-color: #e5e7eb; border-right: 4px solid #4f46e5; }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <aside class="w-48 md:w-64 bg-white border-r border-gray-200 flex flex-col flex-shrink-0">
        <div class="p-4 border-b border-gray-200 flex items-center space-x-2">
            <i class="fa-brands fa-discord text-2xl text-indigo-500"></i>
            <h1 class="text-md md:text-xl font-bold text-gray-800">Dispost Clone</h1>
        </div>
        <nav class="flex-1 p-2 space-y-1">
            <button onclick="switchTab('tokens')" id="nav-tokens" class="w-full flex items-center space-x-2 p-2 rounded-lg text-sm text-gray-700 hover:bg-gray-100 transition">
                <i class="fa-solid fa-key"></i> <span>Tokens</span>
            </button>
            <button onclick="switchTab('configs')" id="nav-configs" class="w-full flex items-center space-x-2 p-2 rounded-lg text-sm text-gray-700 hover:bg-gray-100 transition">
                <i class="fa-solid fa-gears"></i> <span>Configurations</span>
            </button>
            <button onclick="switchTab('logs')" id="nav-logs" class="w-full flex items-center space-x-2 p-2 rounded-lg text-sm text-gray-700 hover:bg-gray-100 transition">
                <i class="fa-solid fa-list-ul"></i> <span>Logs</span>
            </button>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-white border-b border-gray-200 p-4 flex justify-between items-center">
            <h2 id="page-title" class="text-md md:text-lg font-semibold text-gray-800">Dashboard</h2>
        </header>

        <div class="flex-1 overflow-y-auto p-4">
            
            <div id="tab-tokens" class="tab-content hidden">
                <div class="bg-white rounded-lg shadow p-4 mb-4">
                    <h3 class="text-md font-bold text-gray-800 mb-2">Add Discord Token</h3>
                    <div class="flex flex-col md:flex-row gap-2">
                        <input type="password" id="input-token" placeholder="Enter Discord Token..." class="flex-1 border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none">
                        <button onclick="addToken()" class="bg-indigo-600 text-white px-4 py-2 rounded-md text-sm font-medium">Add Token</button>
                    </div>
                    <p class="text-xs text-red-500 mt-2">Jangan bagikan token Anda.</p>
                </div>
                <div class="bg-white rounded-lg shadow p-4">
                    <h3 class="text-md font-bold text-gray-800 mb-2">Your Tokens (<span id="token-count">0</span>)</h3>
                    <div id="token-list" class="space-y-2 text-sm text-gray-600">Memuat data...</div>
                </div>
            </div>

            <div id="tab-configs" class="tab-content hidden">
                <div class="grid grid-cols-2 gap-2 mb-4">
                    <div class="bg-white p-3 rounded-lg shadow">
                        <p class="text-xs text-gray-500 font-semibold">CONFIG SLOTS</p>
                        <p class="text-lg font-bold text-gray-800" id="config-slot-count">0 / 20</p>
                    </div>
                    <div class="bg-white p-3 rounded-lg shadow">
                        <p class="text-xs text-gray-500 font-semibold">RUNNING</p>
                        <p class="text-lg font-bold text-gray-800" id="running-count">0</p>
                    </div>
                </div>
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-md font-bold text-gray-800">Configurations</h3>
                    <button onclick="openConfigModal()" class="bg-indigo-600 text-white px-3 py-1 rounded-md text-sm"><i class="fa-solid fa-plus"></i> New</button>
                </div>
                <div id="config-list" class="space-y-2 text-sm text-gray-600">Memuat data...</div>
            </div>

            <div id="tab-logs" class="tab-content hidden">
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <div class="p-3 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
                        <span class="font-semibold text-gray-700 text-sm">Activity Logs</span>
                        <button onclick="clearLogs()" class="text-xs text-red-500">Clear</button>
                    </div>
                    <div id="log-list" class="divide-y divide-gray-200 max-h-96 overflow-y-auto text-sm p-2">
                        Belum ada aktivitas.
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Modal New Config -->
    <div id="config-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-sm p-4">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-md font-bold text-gray-800">New Config</h3>
                <button onclick="closeConfigModal()" class="text-gray-500"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="space-y-3 text-sm">
                <div>
                    <label class="block text-gray-700 mb-1">Config Name</label>
                    <input type="text" id="cfg-name" class="w-full border rounded px-2 py-1" placeholder="Promo 1">
                </div>
                <div>
                    <label class="block text-gray-700 mb-1">Message Content (Pesan)</label>
                    <textarea id="cfg-message" class="w-full border rounded px-2 py-1" rows="3" placeholder="Tulis pesan promosi Anda di sini..."></textarea>
                </div>
                <div>
                    <label class="block text-gray-700 mb-1">Token</label>
                    <select id="cfg-token" class="w-full border rounded px-2 py-1"></select>
                </div>
                <div>
                    <label class="block text-gray-700 mb-1">Channel ID</label>
                    <input type="text" id="cfg-channel" class="w-full border rounded px-2 py-1" placeholder="1234567890">
                </div>
                <div>
                    <label class="block text-gray-700 mb-1">Delay (Detik)</label>
                    <input type="number" id="cfg-delay" value="60" class="w-full border rounded px-2 py-1">
                </div>
            </div>
            <div class="mt-4 flex justify-end space-x-2">
                <button onclick="closeConfigModal()" class="px-3 py-1 border rounded text-sm text-gray-700">Cancel</button>
                <button onclick="createConfig()" class="bg-indigo-600 text-white px-3 py-1 rounded text-sm">Create</button>
            </div>
        </div>
    </div>

    <script>
        let tokens = [];
        let configs = [];
        let logs = [];

        async function fetchAPI(endpoint, method = 'GET', body = null) {
            try {
                const options = { method, headers: { 'Content-Type': 'application/json' } };
                if (body) options.body = JSON.stringify(body);
                const res = await fetch(endpoint, options);
                if (!res.ok) throw new Error('Network response was not ok');
                return await res.json();
            } catch (error) {
                console.error("API Error:", error);
                return null;
            }
        }

        async function init() {
            await loadData();
            switchTab('configs');
        }

        async function loadData() {
            const tokenData = await fetchAPI('/api/tokens');
            if (tokenData) tokens = tokenData;

            const configData = await fetchAPI('/api/configs');
            if (configData) configs = configData;

            const logData = await fetchAPI('/api/logs');
            if (logData) logs = logData;

            renderTokens();
            renderConfigs();
            renderLogs();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            const target = document.getElementById(`tab-${tabId}`);
            if(target) target.classList.remove('hidden');
            
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('sidebar-active'));
            const navBtn = document.getElementById(`nav-${tabId}`);
            if(navBtn) navBtn.classList.add('sidebar-active');
            
            const titles = { tokens: 'Token Management', configs: 'Discord Configuration', logs: 'Activity Logs' };
            document.getElementById('page-title').innerText = titles[tabId] || 'Dashboard';
        }

        async function addToken() {
            const input = document.getElementById('input-token');
            const val = input.value.trim();
            if (!val) return alert('Token kosong!');
            
            await fetchAPI('/api/tokens', 'POST', { token: val });
            input.value = '';
            await loadData();
            alert('Token berhasil disimpan!');
        }

        async function deleteToken(id) {
            if (!confirm('Hapus token ini?')) return;
            await fetchAPI(`/api/tokens/${id}`, 'DELETE');
            await loadData();
        }

        function renderTokens() {
            const list = document.getElementById('token-list');
            document.getElementById('token-count').innerText = tokens.length;
            if (tokens.length === 0) {
                list.innerHTML = '<p class="text-gray-400">Belum ada token.</p>';
                return;
            }
            list.innerHTML = tokens.map(t => `
                <div class="flex justify-between items-center p-2 border rounded bg-gray-50">
                    <div>
                        <p class="font-bold text-gray-800">${t.username}</p>
                        <p class="text-xs text-gray-500">${t.token.substring(0,8)}...</p>
                    </div>
                    <button onclick="deleteToken('${t._id}')" class="text-red-500 p-1"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }

        function openConfigModal() {
            if (tokens.length === 0) return alert('Tambahkan Token dulu di tab Tokens!');
            document.getElementById('cfg-token').innerHTML = tokens.map(t => `<option value="${t._id}">${t.username}</option>`).join('');
            document.getElementById('config-modal').classList.remove('hidden');
        }

        function closeConfigModal() {
            document.getElementById('config-modal').classList.add('hidden');
            document.getElementById('cfg-name').value = '';
            document.getElementById('cfg-message').value = ''; // Reset pesan
            document.getElementById('cfg-channel').value = '';
        }

        async function createConfig() {
            const name = document.getElementById('cfg-name').value;
            const message = document.getElementById('cfg-message').value; // Ambil pesan
            const tokenId = document.getElementById('cfg-token').value;
            const channel = document.getElementById('cfg-channel').value;
            const delay = parseInt(document.getElementById('cfg-delay').value) || 60;

            if (!name || !channel) return alert('Isi nama dan Channel ID!');

            await fetchAPI('/api/configs', 'POST', { name, message, tokenId, channel, delay });
            closeConfigModal();
            await loadData();
        }

        async function toggleConfig(id) {
            await fetchAPI(`/api/configs/${id}/toggle`, 'POST');
            await loadData();
        }

        async function deleteConfig(id) {
            if (!confirm('Hapus config ini?')) return;
            await fetchAPI(`/api/configs/${id}`, 'DELETE');
            await loadData();
        }

        function renderConfigs() {
            const list = document.getElementById('config-list');
            document.getElementById('config-slot-count').innerText = `${configs.length} / 20`;
            document.getElementById('running-count').innerText = configs.filter(c => c.status === 'RUNNING').length;

            if (configs.length === 0) {
                list.innerHTML = '<p class="text-gray-400">Belum ada konfigurasi.</p>';
                return;
            }
            list.innerHTML = configs.map(c => {
                const color = c.status === 'RUNNING' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-700';
                return `
                    <div class="bg-white p-3 rounded-lg shadow border flex justify-between items-center">
                        <div>
                            <h4 class="font-bold text-gray-800 text-sm">${c.name} <span class="text-xs px-2 py-0.5 rounded ${color}">${c.status}</span></h4>
                            <p class="text-xs text-gray-500">Ch: ${c.channel} • Terkirim: ${c.sentCount}</p>
                        </div>
                        <div class="flex space-x-1">
                            <button onclick="toggleConfig('${c._id}')" class="p-2 rounded ${c.status==='RUNNING'?'bg-yellow-100 text-yellow-600':'bg-green-100 text-green-600'}">
                                <i class="fa-solid ${c.status==='RUNNING'?'fa-pause':'fa-play'}"></i>
                            </button>
                            <button onclick="deleteConfig('${c._id}')" class="p-2 rounded bg-red-100 text-red-600"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderLogs() {
            const list = document.getElementById('log-list');
            if (logs.length === 0) {
                list.innerHTML = '<p class="text-gray-400">Belum ada aktivitas.</p>';
                return;
            }
            list.innerHTML = logs.map(l => `
                <div class="p-2 flex justify-between border-b text-xs">
                    <div><span class="font-bold">${l.name}</span> - ${l.msg}</div>
                    <div class="text-gray-400">${l.time}</div>
                </div>
            `).join('');
        }

        function clearLogs() {
            logs = [];
            renderLogs();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
                    </html>
